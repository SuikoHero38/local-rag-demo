services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  api:
    build: .
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - CHROMA_DIR=/app/chroma
      - DOCS_DIR=/app/docs
      - TOP_K=4
    volumes:
      - ./docs:/app/docs
      - ./chroma:/app/chroma
    ports:
      - "8001:8000"
    depends_on:
      - ollama

volumes:
  ollama:
